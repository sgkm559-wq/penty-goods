<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぺんてぃグッズ</title>
  <meta name="description" content="BOOTH・SUZURIで販売中のぺんてぃグッズをまとめたページです。">
  <meta property="og:title" content="ぺんてぃグッズ">
  <meta property="og:description" content="BOOTH・SUZURIで販売中のぺんてぃグッズをまとめたページです。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>ぺんてぃグッズ</h1>
    <p class="lead">BOOTH・SUZURIで販売中のぺんてぃグッズをまとめました</p>
  </header>

  <main>
    <nav class="filters" aria-label="ショップで絞り込み">
      <button class="filter is-active" data-shop="ALL">すべて</button>
      <button class="filter" data-shop="BOOTH">BOOTH</button>
      <button class="filter" data-shop="SUZURI">SUZURI</button>
    </nav>

    <ul id="grid" class="grid"></ul>
    <p id="empty" class="empty" hidden>まだ商品がありません</p>
  </main>

  <footer class="site-footer">
    <div class="shops">
      <a href="https://comacraft.booth.pm/" target="_blank" rel="noopener">BOOTHショップ</a>
      <a href="https://suzuri.jp/comacraft/products" target="_blank" rel="noopener">SUZURIショップ</a>
    </div>
    <p class="copy">© comacraft</p>
  </footer>

  <script>
    // 商品リストは毎回最新を読み込む（ブラウザのキャッシュで古い一覧が出ないように）
    const list = document.createElement("script");
    list.src = "products.js?v=" + Date.now();
    list.onload = () => {
      const main = document.createElement("script");
      main.src = "script.js";
      document.body.append(main);
    };
    document.body.append(list);
  </script>
</body>
</html>
